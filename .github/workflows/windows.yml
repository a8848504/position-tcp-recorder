name: Windows test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - name: Native desktop smoke test
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-H windowsgui' -o desktop-smoke.exe ./cmd/tcp-recorder
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $app = Start-Process -FilePath (Join-Path $PWD desktop-smoke.exe) -PassThru
          try {
            $until = [DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 200
              $app.Refresh()
              if ($app.HasExited) { throw "GUI exited with code $($app.ExitCode)" }
            } until ($app.MainWindowHandle -ne [IntPtr]::Zero -or [DateTime]::UtcNow -gt $until)
            if ($app.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Desktop window was not created' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check tag and build full portable release
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $declared = (Select-String 'const Current = "([0-9.]+)"' internal/version/version.go).Matches[0].Groups[1].Value
          if ($env:VERSION -ne "v$declared") { throw 'Tag differs from source version' }
          python scripts/package.py --sevenzip 'C:\Program Files\7-Zip\7z.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          $release = Get-ChildItem dist -Directory | Select-Object -First 1
          $assets = @(Get-ChildItem $release.FullName -File | ForEach-Object FullName)
          $assets += @(Get-ChildItem dist -File -Filter '*.zip' | ForEach-Object FullName)
          gh release create $env:VERSION --verify-tag --latest --generate-notes @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
